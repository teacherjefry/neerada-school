<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neerada IT Dept - Task Tracker</title>
    
    <!-- Replace 'favicon.ico' and 'apple-touch-icon.png' with your actual logo files -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html[data-theme="crystal"] {
            --bg-main: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            --panel-bg: rgba(255, 255, 255, 0.25);
            --panel-border: rgba(255, 255, 255, 0.4);
            --panel-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --panel-blur: blur(12px);
            --text-main: #1e293b;
            --text-muted: #475569;
            --btn-bg: #0ea5e9;
            --btn-text: #ffffff;
            --btn-hover: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(255, 255, 255, 0.6);
            --input-focus: #0ea5e9;
            --icon-bg: rgba(255, 255, 255, 0.5);
            --icon-color: #0284c7;
            --table-border: rgba(255, 255, 255, 0.3);
            --table-hover: rgba(255, 255, 255, 0.5);
        }

        html[data-theme="mcdonalds"] {
            --bg-main: linear-gradient(135deg, #da291c 0%, #b32117 100%);
            --panel-bg: #ffffff;
            --panel-border: #ffc72c;
            --panel-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.25);
            --panel-blur: none;
            --text-main: #27251f;
            --text-muted: #5c5950;
            --btn-bg: #ffc72c;
            --btn-text: #da291c;
            --btn-hover: #e6b227;
            --input-bg: #fdfdfd;
            --input-border: #e0e0e0;
            --input-focus: #ffc72c;
            --icon-bg: #ffc72c;
            --icon-color: #da291c;
            --table-border: #eeeeee;
            --table-hover: #fffdf5;
        }

        html[data-theme="dark"] {
            --bg-main: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --panel-shadow: 0 8px 32px 0 rgba(0,0,0, 0.5);
            --panel-blur: none;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #3b82f6;
            --btn-text: #ffffff;
            --btn-hover: #2563eb;
            --input-bg: #0f172a;
            --input-border: #334155;
            --input-focus: #3b82f6;
            --icon-bg: #334155;
            --icon-color: #3b82f6;
            --table-border: #334155;
            --table-hover: #293548;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Themed core classes */
        .theme-panel {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            backdrop-filter: var(--panel-blur);
            -webkit-backdrop-filter: var(--panel-blur);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .theme-input {
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .theme-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(0,0,0, 0.05);
            outline: none;
        }

        .theme-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        .theme-text { color: var(--text-main); transition: color 0.3s; }
        .theme-text-muted { color: var(--text-muted); transition: color 0.3s; }
        .theme-border { border-color: var(--panel-border); }

        .theme-icon-box {
            background: var(--icon-bg);
            color: var(--icon-color);
            transition: all 0.3s ease;
        }

        .theme-table-row {
            border-bottom: 1px solid var(--table-border);
            transition: background-color 0.2s;
        }
        
        .theme-table-row:hover {
            background-color: var(--table-hover);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Print Specific Styles */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .theme-panel { background: none !important; backdrop-filter: none !important; border: none !important; box-shadow: none !important; }
            .print-only { display: block !important; }
            #taskList { max-height: none !important; overflow: visible !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd !important; padding: 8px !important; text-align: left !important; color: #000 !important; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; color: #000 !important; }
        }
        
        .print-only { display: none; }
        
        /* Utility for color-scheme */
        color-scheme: light dark;
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-5xl theme-panel p-6 md:p-10 relative">
        
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center border-b theme-border pb-6">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <!-- Interactive Logo Upload -->
                <div class="w-16 h-16 rounded-full theme-icon-box flex items-center justify-center cursor-pointer relative overflow-hidden group shadow-inner" onclick="document.getElementById('logoUpload').click()" title="Click to upload custom logo">
                    <img id="displayLogo" src="apple-touch-icon.png" class="absolute inset-0 w-full h-full object-cover hidden bg-white" alt="Logo">
                    <i id="defaultIcon" class="fa-solid fa-network-wired text-2xl"></i>
                    <div class="absolute inset-0 bg-black/60 hidden group-hover:flex items-center justify-center transition-all">
                        <i class="fa-solid fa-camera text-white text-sm"></i>
                    </div>
                    <input type="file" id="logoUpload" accept="image/*" class="hidden">
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight theme-text">IT Department</h1>
                    <p class="theme-text-muted font-medium">Neerada School</p>
                </div>
            </div>
            <div class="no-print flex flex-col sm:flex-row gap-3 items-center">
                <select id="themeSelect" class="theme-input px-3 py-2.5 rounded-xl font-semibold outline-none cursor-pointer text-sm">
                    <option value="mcdonalds">🍟 McDonald's Theme</option>
                    <option value="crystal">💎 Crystal Theme</option>
                    <option value="dark">🌙 Dark Mode</option>
                </select>
                <button onclick="window.print()" class="theme-panel px-5 py-2.5 rounded-xl theme-text font-bold shadow-sm flex items-center gap-2 border-2 hover:opacity-80 transition-opacity">
                    <i class="fa-solid fa-print"></i> Print Report
                </button>
            </div>
        </header>

        <!-- Print Header Layout -->
        <div class="print-only mb-8 text-center border-b-2 border-black pb-6">
            <img id="printLogo" src="apple-touch-icon.png" alt="Neerada School Logo" class="mx-auto h-24 w-24 object-contain mb-3">
            <h1 class="text-3xl font-black text-black tracking-tight uppercase">Neerada School IT Operations</h1>
            <p class="text-lg text-gray-700 font-medium italic mb-4">Empowering Education Through Seamless Technology</p>
            <h2 class="text-xl font-bold text-black" id="printDate"></h2>
        </div>

        <div class="no-print theme-panel p-5 mb-8">
            <form id="taskForm" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label for="taskDesc" class="block text-sm font-semibold theme-text mb-1">Task Description</label>
                    <input type="text" id="taskDesc" required placeholder="What did you do? (e.g., Fixed projector in Room 102)" 
                           class="w-full px-4 py-3 rounded-xl theme-input">
                </div>
                <!-- Add Date & Time selection for backdating -->
                <div class="w-full md:w-56">
                    <label for="taskDateTime" class="block text-sm font-semibold theme-text mb-1">Date & Time</label>
                    <input type="datetime-local" id="taskDateTime" required 
                           class="w-full px-4 py-3 rounded-xl theme-input font-medium">
                </div>
                <div class="flex items-end">
                    <button type="submit" id="addBtn" class="w-full md:w-auto theme-btn px-6 py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </div>
            </form>
        </div>

        <div class="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 px-2 gap-4">
            <h2 class="text-xl font-bold theme-text">Task History</h2>
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-sm font-semibold theme-text-muted mr-2">Filter by:</span>
                
                <div class="relative group">
                    <input type="date" id="filterSpecificDate" class="px-3 py-2 rounded-lg theme-input text-sm" title="Check specific date">
                    <button id="clearDateFilter" class="hidden absolute right-2 top-1/2 -translate-y-1/2 theme-text-muted hover:text-red-500 transition-colors">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <span class="theme-text-muted text-sm px-1">or</span>

                <select id="filterMonth" class="px-3 py-2 rounded-lg theme-input text-sm font-medium">
                    <!-- Populated by JS -->
                </select>
                <select id="filterYear" class="px-3 py-2 rounded-lg theme-input text-sm font-medium">
                    <!-- Populated by JS -->
                </select>
            </div>
        </div>

        <div class="theme-panel overflow-hidden border-none p-1">
            <div class="overflow-x-auto rounded-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b theme-border opacity-80">
                            <th class="p-4 font-bold theme-text w-48">Date & Time</th>
                            <th class="p-4 font-bold theme-text">Description</th>
                            <th class="p-4 font-bold theme-text w-24 text-center no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskList">
                        <!-- Tasks will be injected here via JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden p-8 text-center theme-text-muted">
                <i class="fa-solid fa-clipboard-check text-5xl mb-3 opacity-50"></i>
                <p class="font-medium text-lg">No tasks recorded for this period.</p>
            </div>
        </div>
        
        <footer class="mt-12 text-center theme-text-muted text-sm font-bold">
            <p>&copy; <span id="currentYear"></span> Neerada School IT Department. All rights reserved.</p>
        </footer>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnH_CQMejMwdB7r16-H0UQlbUWkmKkwHY",
            authDomain: "nrd-tuition.firebaseapp.com",
            projectId: "nrd-tuition",
            storageBucket: "nrd-tuition.firebasestorage.app",
            messagingSenderId: "392714893047",
            appId: "1:392714893047:web:363ea8e258e55e7c50c5f2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const myAppId = "nrd-tuition";
        let currentUserUid = null;
        let tasks = [];
        let unsubscribe = null;

        // DOM Elements
        const taskForm = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const filterMonth = document.getElementById('filterMonth');
        const filterYear = document.getElementById('filterYear');
        const filterSpecificDate = document.getElementById('filterSpecificDate');
        const clearDateFilterBtn = document.getElementById('clearDateFilter');
        const printDate = document.getElementById('printDate');
        const addBtn = document.getElementById('addBtn');
        const themeSelect = document.getElementById('themeSelect');
        const taskDateTime = document.getElementById('taskDateTime');
        
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        async function init() {
            initTheme();
            initLogo();
            setDefaultDateTime();
            setupFilters();
            
            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

            try {
                const userCred = await signInAnonymously(auth);
                currentUserUid = userCred.user.uid;
                
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Task';
                
                setupRealtimeListener();
            } catch (error) {
                console.error("Authentication failed:", error);
                addBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> DB Error';
            }
            
            taskForm.addEventListener('submit', handleAddTask);
            filterMonth.addEventListener('change', () => { clearSpecificDateFilter(); renderTasks(); });
            filterYear.addEventListener('change', () => { clearSpecificDateFilter(); renderTasks(); });
            filterSpecificDate.addEventListener('change', () => {
                if(filterSpecificDate.value) clearDateFilterBtn.classList.remove('hidden');
                else clearDateFilterBtn.classList.add('hidden');
                renderTasks();
            });
            clearDateFilterBtn.addEventListener('click', () => {
                clearSpecificDateFilter();
                renderTasks();
            });
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('neerada_theme') || 'mcdonalds';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeSelect.value = savedTheme;

            themeSelect.addEventListener('change', (e) => {
                document.documentElement.setAttribute('data-theme', e.target.value);
                localStorage.setItem('neerada_theme', e.target.value);
            });
        }

        function initLogo() {
            const savedLogo = localStorage.getItem('neerada_logo');
            if (savedLogo) {
                document.getElementById('displayLogo').src = savedLogo;
                document.getElementById('printLogo').src = savedLogo;
                document.getElementById('displayLogo').classList.remove('hidden');
                document.getElementById('defaultIcon').classList.add('hidden');
            }

            document.getElementById('logoUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const dataUrl = evt.target.result;
                        localStorage.setItem('neerada_logo', dataUrl); // Save for next time
                        document.getElementById('displayLogo').src = dataUrl;
                        document.getElementById('printLogo').src = dataUrl;
                        document.getElementById('displayLogo').classList.remove('hidden');
                        document.getElementById('defaultIcon').classList.add('hidden');
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        function setDefaultDateTime() {
            const now = new Date();
            // Adjust to exact local time offset for the HTML datetime-local input formatting
            const local = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
            taskDateTime.value = local.toISOString().slice(0, 16);
        }

        function setupRealtimeListener() {
            if (!currentUserUid) return;
            
            const tasksRef = collection(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks');
            
            unsubscribe = onSnapshot(tasksRef, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderTasks();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function clearSpecificDateFilter() {
            filterSpecificDate.value = '';
            clearDateFilterBtn.classList.add('hidden');
        }

        function setupFilters() {
            const months = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            months.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = month;
                if (index === currentMonth) option.selected = true;
                filterMonth.appendChild(option);
            });

            for (let i = currentYear - 2; i <= currentYear + 2; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                if (i === currentYear) option.selected = true;
                filterYear.appendChild(option);
            }
        }

        async function handleAddTask(e) {
            e.preventDefault();
            if (!currentUserUid) return;
            
            const desc = document.getElementById('taskDesc').value;
            // Use the selected date/time instead of strictly right now
            const selectedDate = new Date(taskDateTime.value); 
            const dateString = selectedDate.toISOString();
            
            const newTask = {
                desc,
                date: dateString, 
                createdAt: new Date().toISOString()
            };
            
            try {
                const tasksRef = collection(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks');
                await addDoc(tasksRef, newTask);
                
                if(!filterSpecificDate.value) {
                    filterMonth.value = selectedDate.getMonth();
                    filterYear.value = selectedDate.getFullYear();
                }
                
                document.getElementById('taskDesc').value = '';
                setDefaultDateTime(); // Reset back to NOW after saving
                document.getElementById('taskDesc').focus();
            } catch(err) {
                console.error("Error adding doc: ", err);
            }
        }

        window.deleteTask = async function(id) {
            if (!currentUserUid) return;
            try {
                const docRef = doc(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks', id);
                await deleteDoc(docRef);
            } catch(err) {
                console.error("Error deleting doc: ", err);
            }
        }

        function renderTasks() {
            const selectedMonth = parseInt(filterMonth.value);
            const selectedYear = parseInt(filterYear.value);
            const specificDateVal = filterSpecificDate.value;
            const months = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];

            let filteredTasks = [];

            if (specificDateVal) {
                const targetDate = new Date(specificDateVal);
                filteredTasks = tasks.filter(task => {
                    const taskDate = new Date(task.date);
                    return taskDate.getDate() === targetDate.getDate() &&
                           taskDate.getMonth() === targetDate.getMonth() &&
                           taskDate.getFullYear() === targetDate.getFullYear();
                });
                const dString = targetDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                printDate.textContent = `Daily Task Report: ${dString}`;
            } else {
                filteredTasks = tasks.filter(task => {
                    const taskDate = new Date(task.date);
                    return taskDate.getMonth() === selectedMonth && 
                           taskDate.getFullYear() === selectedYear;
                });
                printDate.textContent = `Monthly Report: ${months[selectedMonth]} ${selectedYear}`;
            }
            
            filteredTasks.sort((a, b) => new Date(b.date) - new Date(a.date));
            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filteredTasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.className = 'theme-table-row transition-colors group';
                
                const d = new Date(task.date);
                const dateDisplay = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                const timeDisplay = d.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });

                tr.innerHTML = `
                    <td class="p-4 theme-text font-medium whitespace-nowrap">
                        <div class="flex flex-col">
                            <span>${dateDisplay}</span>
                            <span class="text-xs theme-text-muted mt-1">${timeDisplay}</span>
                        </div>
                    </td>
                    <td class="p-4 theme-text font-medium">${task.desc}</td>
                    <td class="p-4 text-center no-print">
                        <button onclick="deleteTask('${task.id}')" class="text-red-500 hover:text-red-700 transition-colors p-2 rounded-full hover:bg-red-50 opacity-50 group-hover:opacity-100" title="Delete Task">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                taskList.appendChild(tr);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
