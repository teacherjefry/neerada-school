<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neerada IT Dept - Task Tracker</title>
    
    <!-- Replace 'favicon.ico' and 'apple-touch-icon.png' with your actual logo files -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-primary: #1e293b;
            --accent: #0ea5e9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* The core crystal/glassmorphism effect */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 1.5rem;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }
        
        .glass-button {
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            border: 1px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        
        .glass-button:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 100%);
            transform: translateY(-1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233, 0.5);
        }

        /* Print Specific Styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            .no-print {
                display: none !important;
            }
            .glass-panel {
                background: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border: none;
                box-shadow: none;
            }
            .print-only {
                display: block !important;
            }
            #taskList {
                max-height: none !important;
                overflow: visible !important;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th, td {
                border: 1px solid #ddd;
                padding: 8px;
                text-align: left;
            }
            th {
                background-color: #f3f4f6;
            }
        }
        
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-5xl glass-panel p-6 md:p-10 relative">
        
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center border-b border-white/30 pb-6">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-16 h-16 rounded-full glass-panel flex items-center justify-center bg-white/40">
                    <i class="fa-solid fa-network-wired text-2xl text-sky-600"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-slate-800">IT Department</h1>
                    <p class="text-slate-600 font-medium">Neerada School</p>
                </div>
            </div>
            <div class="no-print flex gap-3">
                <button onclick="window.print()" class="glass-button px-5 py-2.5 rounded-xl text-sky-700 font-semibold shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Print Report
                </button>
            </div>
        </header>
        <div class="print-only mb-8 text-center border-b-2 border-slate-800 pb-6">
            <!-- Utilizing your uploaded apple-touch-icon as the print logo -->
            <img src="apple-touch-icon.png" alt="Neerada School Logo" class="mx-auto h-24 w-24 object-contain mb-3">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight uppercase">Neerada School IT Operations</h1>
            <p class="text-lg text-slate-600 font-medium italic mb-4">Empowering Education Through Seamless Technology</p>
            <h2 class="text-xl font-bold text-slate-800" id="printDate"></h2>
        </div>

        <div class="no-print glass-panel p-5 mb-8 bg-white/20">
            <form id="taskForm" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label for="taskDesc" class="block text-sm font-semibold text-slate-700 mb-1">Task Description</label>
                    <input type="text" id="taskDesc" required placeholder="e.g., Fixed projector in Room 102" 
                           class="w-full px-4 py-3 rounded-xl glass-input text-slate-800 placeholder-slate-400">
                </div>
                <div class="flex items-end">
                    <button type="submit" id="addBtn" class="w-full md:w-auto bg-sky-500 hover:bg-sky-600 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-lg shadow-sky-500/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </div>
            </form>
        </div>
        <div class="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 px-2 gap-4">
            <h2 class="text-xl font-bold text-slate-800">Task History</h2>
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-sm font-semibold text-slate-600 mr-2">Filter by:</span>
                
                <!-- Specific Date Filter -->
                <div class="relative group">
                    <input type="date" id="filterSpecificDate" class="px-3 py-1.5 rounded-lg glass-input text-sm text-slate-700" title="Check specific date">
                    <button id="clearDateFilter" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <span class="text-slate-400 text-sm">or</span>

                <!-- Month/Year Filter (for monthly reports) -->
                <select id="filterMonth" class="px-3 py-1.5 rounded-lg glass-input text-sm text-slate-700">
                    <!-- Populated by JS -->
                </select>
                <select id="filterYear" class="px-3 py-1.5 rounded-lg glass-input text-sm text-slate-700">
                    <!-- Populated by JS -->
                </select>
            </div>
        </div>

        <div class="glass-panel overflow-hidden bg-white/30">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white/40 border-b border-white/50">
                            <th class="p-4 font-semibold text-slate-700 w-48">Date & Time</th>
                            <th class="p-4 font-semibold text-slate-700">Description</th>
                            <th class="p-4 font-semibold text-slate-700 w-24 text-center no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskList" class="divide-y divide-white/20">
                        <!-- Tasks will be injected here via JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden p-8 text-center text-slate-500">
                <i class="fa-solid fa-clipboard-check text-4xl mb-3 opacity-50"></i>
                <p>No tasks recorded for this period.</p>
            </div>
        </div>
        
        <footer class="mt-12 text-center text-slate-600 text-sm font-medium">
            <p>&copy; <span id="currentYear"></span> Neerada School IT Department. All rights reserved.</p>
        </footer>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBnH_CQMejMwdB7r16-H0UQlbUWkmKkwHY",
  authDomain: "nrd-tuition.firebaseapp.com",
  projectId: "nrd-tuition",
  storageBucket: "nrd-tuition.firebasestorage.app",
  messagingSenderId: "392714893047",
  appId: "1:392714893047:web:7f8b10caebd74f4c50c5f2"
};


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const myAppId = "nrd-tuition";
        let currentUserUid = null;
        let tasks = [];
        let unsubscribe = null;

        // DOM Elements
        const taskForm = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const filterMonth = document.getElementById('filterMonth');
        const filterYear = document.getElementById('filterYear');
        const filterSpecificDate = document.getElementById('filterSpecificDate');
        const clearDateFilterBtn = document.getElementById('clearDateFilter');
        const printDate = document.getElementById('printDate');
        const addBtn = document.getElementById('addBtn');
        
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        async function init() {
            setupFilters();
            
            // Show loading state on the button
            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

            try {
                // Ensure authentication completes before querying
                const userCred = await signInAnonymously(auth);
                currentUserUid = userCred.user.uid;
                
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Task';
                
                setupRealtimeListener();
            } catch (error) {
                console.error("Authentication failed:", error);
                addBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> DB Error';
            }
            
            taskForm.addEventListener('submit', handleAddTask);
            filterMonth.addEventListener('change', () => { clearSpecificDateFilter(); renderTasks(); });
            filterYear.addEventListener('change', () => { clearSpecificDateFilter(); renderTasks(); });
            filterSpecificDate.addEventListener('change', () => {
                if(filterSpecificDate.value) clearDateFilterBtn.classList.remove('hidden');
                else clearDateFilterBtn.classList.add('hidden');
                renderTasks();
            });
            clearDateFilterBtn.addEventListener('click', () => {
                clearSpecificDateFilter();
                renderTasks();
            });
        }

        function setupRealtimeListener() {
            if (!currentUserUid) return;
            
            const tasksRef = collection(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks');
            
            unsubscribe = onSnapshot(tasksRef, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderTasks();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function clearSpecificDateFilter() {
            filterSpecificDate.value = '';
            clearDateFilterBtn.classList.add('hidden');
        }

        function setupFilters() {
            const months = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            months.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = month;
                if (index === currentMonth) option.selected = true;
                filterMonth.appendChild(option);
            });

            for (let i = currentYear - 2; i <= currentYear + 2; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                if (i === currentYear) option.selected = true;
                filterYear.appendChild(option);
            }
        }

        async function handleAddTask(e) {
            e.preventDefault();
            if (!currentUserUid) return;
            
            const desc = document.getElementById('taskDesc').value;
            const now = new Date();
            const dateString = now.toISOString();
            
            const newTask = {
                desc,
                date: dateString, 
                createdAt: dateString
            };
            
            try {
                const tasksRef = collection(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks');
                await addDoc(tasksRef, newTask);
                
                if(!filterSpecificDate.value) {
                    filterMonth.value = now.getMonth();
                    filterYear.value = now.getFullYear();
                }
                
                document.getElementById('taskDesc').value = '';
                document.getElementById('taskDesc').focus();
            } catch(err) {
                console.error("Error adding doc: ", err);
            }
        }

        window.deleteTask = async function(id) {
            if (!currentUserUid) return;
            try {
                const docRef = doc(db, 'artifacts', myAppId, 'users', currentUserUid, 'tasks', id);
                await deleteDoc(docRef);
            } catch(err) {
                console.error("Error deleting doc: ", err);
            }
        }

        function renderTasks() {
            const selectedMonth = parseInt(filterMonth.value);
            const selectedYear = parseInt(filterYear.value);
            const specificDateVal = filterSpecificDate.value;
            const months = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];

            let filteredTasks = [];

            if (specificDateVal) {
                const targetDate = new Date(specificDateVal);
                filteredTasks = tasks.filter(task => {
                    const taskDate = new Date(task.date);
                    return taskDate.getDate() === targetDate.getDate() &&
                           taskDate.getMonth() === targetDate.getMonth() &&
                           taskDate.getFullYear() === targetDate.getFullYear();
                });
                const dString = targetDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                printDate.textContent = `Daily Task Report: ${dString}`;
            } else {
                filteredTasks = tasks.filter(task => {
                    const taskDate = new Date(task.date);
                    return taskDate.getMonth() === selectedMonth && 
                           taskDate.getFullYear() === selectedYear;
                });
                printDate.textContent = `Monthly Report: ${months[selectedMonth]} ${selectedYear}`;
            }
            
            filteredTasks.sort((a, b) => new Date(b.date) - new Date(a.date));
            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filteredTasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/40 transition-colors group';
                
                const d = new Date(task.date);
                const dateDisplay = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                const timeDisplay = d.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });

                tr.innerHTML = `
                    <td class="p-4 text-slate-700 font-medium whitespace-nowrap">
                        <div class="flex flex-col">
                            <span>${dateDisplay}</span>
                            <span class="text-xs text-slate-500">${timeDisplay}</span>
                        </div>
                    </td>
                    <td class="p-4 text-slate-800">${task.desc}</td>
                    <td class="p-4 text-center no-print">
                        <button onclick="deleteTask('${task.id}')" class="text-rose-400 hover:text-rose-600 transition-colors p-2 rounded-full hover:bg-rose-50 opacity-50 group-hover:opacity-100" title="Delete Task">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                taskList.appendChild(tr);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
